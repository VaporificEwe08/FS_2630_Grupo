name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Pruebas de la demo web
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Revisar sintaxis
        run: node --check app/app.js
      - name: Probar flujos de reportes
        run: node --test tests/frontend.test.cjs
